name: Auto Update Database Faskes

on:
  schedule:
    # Jalan otomatis setiap hari Minggu jam 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub Actions

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper Script
        run: |
          python scripts/scraper.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update database faskes [skip ci]"
          file_pattern: "data/database_faskes.json"
