name: Auto Update Database Faskes

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faskes-scraper
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # RUN SCRAPER
      # ============================================================
      - name: Run Scraper Script
        run: |
          python scripts/scraper.py

      # ============================================================
      # SHOW PROGRESS
      # ============================================================
      - name: Show Scraper Progress
        if: always()
        run: |
          echo "=========================================="
          echo "SCRAPER PROGRESS"
          echo "=========================================="

          if [ -f data/scraper-progress.json ]; then
            cat data/scraper-progress.json
          else
            echo "scraper-progress.json tidak ditemukan"
          fi

          echo ""
          echo "=========================================="
          echo "SCRAPER REPORT"
          echo "=========================================="

          if [ -f data/scraper-report.json ]; then
            cat data/scraper-report.json
          else
            echo "scraper-report.json tidak ditemukan"
          fi

      # ============================================================
      # COMMIT & PUSH
      # ============================================================
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update database faskes"
          file_pattern: |
            data/faskes/*.json
            data/database_faskes.json
            data/scraper-progress.json
            data/scraper-report.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: '--force-with-lease'
