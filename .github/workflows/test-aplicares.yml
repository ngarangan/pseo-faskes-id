name: Test Aplicares

on:
  workflow_dispatch:

jobs:
  test-aplicares:
    runs-on: ubuntu-latest

    steps:
      - name: Test Aplicares Homepage
        run: |
          echo "=== PUBLIC IP ==="
          curl -4 -s https://ifconfig.me/ip
          echo
          echo

          echo "=== TEST HOMEPAGE ==="
          curl -4 -k -v \
            --connect-timeout 15 \
            --max-time 30 \
            "https://faskes.bpjs-kesehatan.go.id/aplicares/" \
            -o aplicares.html

          echo
          echo "=== RESPONSE ==="
          wc -c aplicares.html
          head -c 1000 aplicares.html

      - name: Test getData API
        run: |
          echo
          echo "=== TEST API ==="

          curl -4 -k -v \
            --connect-timeout 15 \
            --max-time 60 \
            -X POST \
            -H "Accept: application/json, text/plain, */*" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -H "Origin: https://faskes.bpjs-kesehatan.go.id" \
            -H "Referer: https://faskes.bpjs-kesehatan.go.id/aplicares/" \
            -A "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/139.0.0.0 Mobile Safari/537.36" \
            --data '{"jnsppk":"ALL","kdprop":"01"}' \
            "https://faskes.bpjs-kesehatan.go.id/aplicares/Peta/getData" \
            -o response.json

          echo
          echo "=== JSON RESULT ==="
          wc -c response.json
          head -c 2000 response.json

      - name: Upload response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aplicares-test
          path: |
            aplicares.html
            response.json
          if-no-files-found: ignore
